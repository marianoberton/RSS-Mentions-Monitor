version: '3.8'

services:
  rss-monitor:
    build: .
    container_name: rss-mentions-monitor
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.yml:/app/config.yml
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - FLASK_ENV=production
      - FLASK_APP=web_app.py
      - PYTHONPATH=/app
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rss-network

networks:
  rss-network:
    driver: bridge