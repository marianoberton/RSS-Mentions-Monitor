services:
  rss-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ipc: host
    environment:
      TZ: America/Argentina/Buenos_Aires
      FLASK_ENV: production
      FLASK_APP: web_app.py
      PYTHONPATH: /app
      RSS_FEEDS: "https://site1.com/rss,https://site2.com/feed"
      KEYWORDS: "milei,petri,YPF"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # quita esta línea si no tenés el archivo en repo:
      # - ./config.yml:/app/config.yml
    expose:
      - "5000"
    command: ["./start.sh","web"]
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          python - <<'PY'
          import urllib.request, sys
          try:
              r = urllib.request.urlopen("http://127.0.0.1:5000/health", timeout=5)
              sys.exit(0 if r.status == 200 else 1)
          except Exception:
              sys.exit(1)
          PY
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rss-network

networks:
  rss-network:
    driver: bridge
