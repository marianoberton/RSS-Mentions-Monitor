# EasyPanel Deployment Configuration
# Usar este archivo para deployment directo en EasyPanel

services:
  rss-monitor:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - FLASK_ENV=production
      - FLASK_APP=web_app.py
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    command: >
      bash -c "
        dpkg --configure -a &&
        apt-get update && apt-get install -y gcc curl &&
        pip install --no-cache-dir -r requirements.txt &&
        chmod +x start.sh &&
        ./start.sh
      "
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - rss-network

networks:
  rss-network:
    driver: bridge